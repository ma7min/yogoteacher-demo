<svg viewBox="0 0 760 498" fill="none" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;background:white">
<defs>
  <filter id="sh" x="-6%" y="-8%" width="112%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.09"/>
  </filter>
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,1 L7,4 L0,7 Z" fill="#64748b"/>
  </marker>
  <marker id="arr2" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M8,1 L1,4 L8,7 Z" fill="#64748b"/>
  </marker>
  <marker id="arro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,1 L7,4 L0,7 Z" fill="#ea580c"/>
  </marker>
</defs>

<!-- User box -->
<rect x="280" y="8" width="200" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
<text x="380" y="34" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#1e293b">利用者（学生）</text>
<text x="380" y="54" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#64748b">スマホ・PC・タブレット</text>

<!-- Frontend box -->
<rect x="14" y="110" width="732" height="202" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
<line x1="24" y1="162" x2="736" y2="162" stroke="#bfdbfe" stroke-width="1"/>
<text x="380" y="133" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#1e40af">フロントエンド（ブラウザ）</text>
<text x="380" y="153" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#3b82f6">React・TypeScript・Vite</text>

<!-- Chips Row 1 -->
<rect x="26" y="170" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="110" y="188" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">問題を解く</text>
<rect x="204" y="170" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="288" y="188" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">苦手問題の抽出</text>
<rect x="382" y="170" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="466" y="188" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">正答率の確認</text>
<rect x="560" y="170" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="644" y="188" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">過去問の振り返り</text>

<!-- Chips Row 2 -->
<rect x="26" y="214" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="110" y="232" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">達成度の確認</text>
<rect x="204" y="214" width="168" height="36" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="288" y="232" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#374151">フレンド機能</text>
<rect x="382" y="214" width="168" height="36" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="466" y="232" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#c2410c">通知の設定</text>
<rect x="560" y="214" width="168" height="36" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="644" y="232" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#c2410c">AIアドバイス</text>

<!-- Express box -->
<rect x="14" y="372" width="212" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
<text x="120" y="405" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#14532d">Expressサーバー</text>
<text x="120" y="424" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#16a34a">AI機能の中継（Node.js）</text>

<!-- Firebase box -->
<rect x="274" y="372" width="212" height="90" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" filter="url(#sh)"/>
<text x="380" y="405" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#581c87">Firebase</text>
<text x="380" y="424" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#9333ea">認証・Firestore・通知</text>

<!-- Gemini box -->
<rect x="534" y="372" width="212" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#sh)"/>
<text x="640" y="405" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#7c2d12">Google Gemini API</text>
<text x="640" y="424" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#ea580c">解説・予想問題の生成</text>

<!-- Arrows -->
<line x1="380" y1="72" x2="380" y2="110" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>
<line x1="380" y1="312" x2="380" y2="372" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<polyline points="644,250 644,345 120,345 120,372" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arro)" fill="none"/>
<polyline points="120,462 120,478 640,478 640,462" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
<line x1="226" y1="400" x2="274" y2="400" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr2)" marker-end="url(#arr)"/>

<!-- Badges -->
<text x="408" y="91.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">①</text>
<text x="408" y="342.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">②</text>
<text x="240" y="330.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#ea580c" font-family="sans-serif">③</text>
<text x="258" y="330" dominant-baseline="middle" font-size="9" fill="#ea580c">（AI・通知のみ）</text>
<text x="380" y="478.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">④</text>
<text x="250" y="387.5" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="700" fill="#1e293b" font-family="sans-serif">⑤</text>
</svg>
